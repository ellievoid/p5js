  function addCurve(a, b, ctrl, opacity) {
    var curve = new THREE.QuadraticBezierCurve3(a, ctrl, b);
    var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(28));
    var m = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, opacity: opacity, depthWrite: false });
    root.add(new THREE.Line(geo, m));
    lineMats.push({ m: m, base: opacity });
  }
  var origin = new THREE.Vector3(0, 0, 0), up = new THREE.Vector3(0, 1, 0);
  cards.forEach(function (c, i) {
    var p = c.userData.home, rnd = rng(900 + i * 7);
    var side = new THREE.Vector3().crossVectors(p, up).normalize().multiplyScalar((rnd() - 0.5) * R * 0.6);
    addCurve(origin, p, p.clone().multiplyScalar(0.5).add(side), 0.34);
  });
  var seen = {};
  cards.forEach(function (c, i) {
    var best = -1, bd = 1e9;
    cards.forEach(function (o, j) {
      if (i === j) return;
      var d = c.userData.home.distanceTo(o.userData.home);
      if (d < bd) { bd = d; best = j; }
    });
    var key = Math.min(i, best) + '-' + Math.max(i, best);
    if (seen[key]) return;
    seen[key] = true;
    var a = c.userData.home, b = cards[best].userData.home;
    addCurve(a, b, a.clone().add(b).multiplyScalar(0.3), 0.18);
  });

  // Zentrumsknoten
  (function () {
    var cn = document.createElement('canvas'); cn.width = cn.height = 128;
    var cg = cn.getContext('2d');
    var rg = cg.createRadialGradient(64, 64, 0, 64, 64, 64);
    rg.addColorStop(0, 'rgba(255,255,255,0.9)');
    rg.addColorStop(0.25, 'rgba(255,255,255,0.28)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    cg.fillStyle = rg; cg.fillRect(0, 0, 128, 128);
    cg.fillStyle = '#fff'; cg.fillRect(52, 56, 24, 16);
    var sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cn), transparent: true, depthWrite: false }));
    sp.scale.set(2.2, 2.2, 1);
    root.add(sp);
  })();

  /* ---------- Zustand ---------- */
  var state = { mode: 'attract', angle: 0.6, tilt: BASE_TILT, dim: 0, focus: null };
  var bgState = { g: DEF_G.slice(), b: DEF_B.slice() };
  var bgEl = $('bg'), hint = $('hint'), hintText = $('hintText'), caption = $('caption'), detail = $('detail');
  var idle = null, spinTween = null;

  function applyBg() {
    bgEl.style.setProperty('--glow', 'rgb(' + bgState.g.map(Math.round).join(',') + ')');
    bgEl.style.setProperty('--base', 'rgb(' + bgState.b.map(Math.round).join(',') + ')');
  }
  function tintBg(g, b) {
    gsap.to(bgState.g, { 0: g[0], 1: g[1], 2: g[2], duration: 1.2, ease: 'power2.inOut', onUpdate: applyBg });
    gsap.to(bgState.b, { 0: b[0], 1: b[1], 2: b[2], duration: 1.2, ease: 'power2.inOut' });
  }
  function facTint(rgb) {
    return [rgb.map(function (c) { return c * 0.38 + 8; }), rgb.map(function (c) { return c * 0.08 + 6; })];
  }
  applyBg();

  gsap.set(caption, { autoAlpha: 0 });

  function armIdle() { if (idle) idle.kill(); idle = gsap.delayedCall(IDLE, resetToAttract); }
  function killIdle() { if (idle) { idle.kill(); idle = null; } }

  /* ---------- Karte in die Mitte holen und zurückgeben ---------- */
  function previewFit(c) {
    var d = camZ - PZ;
    var visH = 2 * d * Math.tan(camera.fov * Math.PI / 360);
    var visW = visH * camera.aspect;
    return Math.min(visW * 0.62 / c.userData.w, visH * 0.5 / c.userData.h);
  }
  function syncRoot() {
    root.rotation.set(state.tilt, state.angle, 0);
    root.updateMatrixWorld(true);
  }

  function showCaption(item) {
    var f = FAC[item.f];
    var tag = $('capTag'); tag.textContent = f.name; tag.style.setProperty('--c', f.hex);
    $('capTitle').textContent = item.t;
    $('capMeta').textContent = item.k + ' · ' + item.d;
    gsap.fromTo(caption, { autoAlpha: 0, y: 18 }, { autoAlpha: 1, y: 0, duration: 0.6, delay: 0.7, ease: 'power3.out' });
  }

  function focusCard(c) {
    var u = c.userData;
    gsap.killTweensOf([c.position, c.scale, u]);
    u.blend = 1; u.focused = true; state.focus = c;
    syncRoot();
    scene.attach(c);
    var f = previewFit(c);
    var q0 = c.quaternion.clone(), q1 = new THREE.Quaternion(), p = { t: 0 };
    u.tl = gsap.timeline({ defaults: { duration: 1.2, ease: 'power3.inOut' } });
    u.tl.to(p, { t: 1, onUpdate: function () { c.quaternion.copy(q0).slerp(q1, p.t); } }, 0)
        .to(c.position, { x: 0, y: 0.25, z: PZ }, 0)
        .to(c.scale, { x: f, y: f, z: f }, 0)
        .to(state, { dim: 1, duration: 1 }, 0);
    var tint = facTint(FAC[u.item.f].rgb);
    tintBg(tint[0], tint[1]);
    showCaption(u.item);
    state.mode = 'preview';
    armIdle();
  }

  function unfocus() {
    var c = state.focus;
    if (!c) return;
    var u = c.userData;
    if (u.tl) u.tl.kill();
    gsap.killTweensOf([c.position, c.scale, u]);
    syncRoot();
    root.attach(c);
    u.qStart.copy(c.quaternion);
    u.blend = 0; u.focused = false; state.focus = null;
    gsap.to(c.position, { x: u.home.x, y: u.home.y, z: u.home.z, duration: 1, ease: 'power3.inOut' });
    gsap.to(c.scale, { x: 1, y: 1, z: 1, duration: 1, ease: 'power3.inOut' });
    gsap.to(u, { blend: 1, duration: 1, ease: 'power3.inOut' });
    gsap.to(state, { dim: 0, duration: 0.9 });
  }

  /* ---------- Spin ---------- */
  function startSpin(dir, s) {
    state.mode = 'spinning';
    var turns = 0.6 + s * 1.6;                       // schneller wischen = mehr Umdrehungen
    var dist = dir * turns * Math.PI * 2;
    var dur = Math.min(6.5, 2.2 + s * 0.9);          // und längerer Nachlauf
    spinTween = gsap.to(state, { angle: state.angle + dist, duration: dur, ease: 'power3.out', onComplete: finishSpin });
    gsap.to(state, { tilt: (Math.random() - 0.5) * 0.9, duration: dur * 0.8, ease: 'power2.out' });
  }

  function finishSpin() {
    spinTween = null;
    syncRoot();
    var v = new THREE.Vector3(), best = null, bz = -2;
    cards.forEach(function (c) {
      v.copy(c.userData.home).applyQuaternion(root.quaternion).normalize();
      if (v.z > bz) { bz = v.z; best = c; }
    });
    if (best) focusCard(best);
  }

  function beginDrag() {
    killIdle();
    if (spinTween) { spinTween.kill(); spinTween = null; }
    if (state.mode === 'preview') unfocus();
    gsap.to(caption, { autoAlpha: 0, duration: 0.25 });
    gsap.to(hint, { autoAlpha: 0, duration: 0.3 });
    state.mode = 'dragging';
  }

  function resetToAttract() {
    killIdle();
    if (spinTween) { spinTween.kill(); spinTween = null; }
    if (!detail.hidden) detail.hidden = true;
    unfocus();
    gsap.to(caption, { autoAlpha: 0, duration: 0.3 });
    gsap.to(hint, { autoAlpha: 1, duration: 0.6, delay: 0.6 });
    gsap.to(state, { dim: 0, tilt: BASE_TILT, duration: 1.2, ease: 'power2.inOut' });
    tintBg(DEF_G, DEF_B);
    state.mode = 'attract';
  }

  /* ---------- Detailansicht ---------- */
  function openDetail() {
    var c = state.focus; if (!c) return;
    var item = c.userData.item, f = FAC[item.f];
    if (!c.userData.url) c.userData.url = c.userData.img.toDataURL('image/jpeg', 0.9);
    $('detImg').src = c.userData.url;
    $('detImg').alt = 'Platzhalterbild zu ' + item.t;
    var tag = $('detTag'); tag.textContent = f.name; tag.style.setProperty('--c', f.hex);
    $('detTitle').textContent = item.t;
    $('detKind').textContent = item.k;
    $('detDate').textContent = item.d;
    $('detFac').textContent = f.name;
    $('detText').textContent = item.x;
    var dark = f.rgb.map(function (v) { return Math.round(v * 0.2 + 10); });
    detail.style.setProperty('--detail-bg', 'rgb(' + dark.join(',') + ')');
    detail.hidden = false;
    state.mode = 'detail';
    gsap.fromTo(detail, { clipPath: 'circle(0% at 50% 50%)' }, { clipPath: 'circle(150% at 50% 50%)', duration: 0.8, ease: 'power3.inOut' });
    armIdle();
  }
  function closeDetail() {
    if (state.mode !== 'detail') return;
    gsap.to(detail, { clipPath: 'circle(0% at 50% 50%)', duration: 0.6, ease: 'power3.inOut', onComplete: function () {
      detail.hidden = true; state.mode = 'preview'; armIdle();
    } });
  }
  $('detClose').addEventListener('click', closeDetail);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetail(); });
  document.addEventListener('pointerdown', function () {
    if (state.mode === 'preview' || state.mode === 'detail') armIdle();
  }, true);

  /* ---------- Touch und Maus ---------- */
  var drag = null;
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

  function hitPreview(e) {
    if (!state.focus) return false;
    ndc.set(e.clientX / window.innerWidth * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    if (ray.intersectObject(state.focus).length > 0) return true;
    return e.clientY > caption.getBoundingClientRect().top;
  }
  function handleTap(e) {
    if (state.mode === 'preview') {
      if (hitPreview(e)) openDetail(); else resetToAttract();
    } else if (state.mode === 'attract') {
      gsap.fromTo(hintText, { x: -10 }, { x: 0, duration: 0.7, ease: 'elastic.out(1, 0.4)' });
    }
  }

  canvas.addEventListener('pointerdown', function (e) {
    if (state.mode === 'detail') return;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
    drag = { sx: e.clientX, sy: e.clientY, lx: e.clientX, moved: false, caught: false, s: [{ x: e.clientX, t: performance.now() }] };
    if (state.mode === 'spinning' && spinTween) {
      spinTween.kill(); spinTween = null;
      gsap.killTweensOf(state, 'tilt');
      drag.caught = true;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved) {
      if (Math.hypot(e.clientX - drag.sx, e.clientY - drag.sy) < 8) return;
      drag.moved = true; drag.lx = e.clientX; beginDrag();
    }
    state.angle += (e.clientX - drag.lx) * 0.0065;
    drag.lx = e.clientX;
    var now = performance.now();
    drag.s.push({ x: e.clientX, t: now });
    while (drag.s.length > 2 && now - drag.s[0].t > 110) drag.s.shift();
  });
  function endDrag(e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (!d.moved) {
      if (d.caught) finishSpin(); else handleTap(e);
      return;
    }
    var now = performance.now(), a = d.s[0], b = d.s[d.s.length - 1], v = 0;
    if (now - b.t < 90 && b.t - a.t > 12) v = (b.x - a.x) / (b.t - a.t);   // Pixel pro Millisekunde
    var dir = v !== 0 ? Math.sign(v) : (Math.random() < 0.5 ? -1 : 1);
    startSpin(dir, Math.min(4, Math.max(0.35, Math.abs(v))));
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  /* ---------- Touchhinweis ---------- */
  (function () {
    var path = $('hintPath'), dot = $('hintDot');
    var len = path.getTotalLength(), sw = { p: 0 };
    gsap.timeline({ repeat: -1, repeatDelay: 0.7 })
      .fromTo(sw, { p: 0 }, { p: 1, duration: 1.6, ease: 'power2.inOut', onUpdate: function () {
        var pt = path.getPointAtLength(sw.p * len);
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
        dot.setAttribute('opacity', Math.sin(sw.p * Math.PI).toFixed(3));
      } });
    gsap.to(hintText, { scale: 1.04, duration: 1.1, repeat: -1, yoyo: true, ease: 'sine.inOut' });
  })();

  /* ---------- Render-Schleife ---------- */
  var clock = new THREE.Clock();
  var qInv = new THREE.Quaternion(), qT = new THREE.Quaternion(), tmp = new THREE.Vector3();

  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    if (state.mode === 'attract' && !reduce) state.angle += dt * 0.16;
    root.rotation.set(state.tilt, state.angle, 0);
    qInv.copy(root.quaternion).invert();

    for (var i = 0; i < cards.length; i++) {
      var c = cards[i], u = c.userData;
      if (u.focused) { c.material.color.setScalar(1); continue; }
      qT.copy(u.q0).slerp(qInv, 0.6);                       // Karten drehen sich teilweise zur Kamera
      if (u.blend < 1) c.quaternion.copy(u.qStart).slerp(qT, u.blend); else c.quaternion.copy(qT);
      tmp.copy(u.home).applyQuaternion(root.quaternion);
      var t = THREE.MathUtils.clamp((tmp.z + R) / (2 * R), 0, 1);
      var b = (0.26 + 0.74 * Math.pow(t, 1.25)) * (1 - 0.72 * state.dim);   // Tiefe als Helligkeit
      c.material.color.setScalar(b);
    }
    for (var k = 0; k < lineMats.length; k++) lineMats[k].m.opacity = lineMats[k].base * (1 - 0.8 * state.dim);

    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>

</body></html>
